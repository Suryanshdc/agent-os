global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["host.docker.internal:3000"] }]
  - job_name: orchestrator
    static_configs: [{ targets: ["host.docker.internal:9101"] }]
  - job_name: agents
    static_configs:
      - targets:
          - host.docker.internal:9111
          - host.docker.internal:9112
          - host.docker.internal:9113
