image:
  repository: agent-os
  tag: dev

# Kafka and Neo4j run in Docker Compose. The kind node is attached to the same Docker
# network, so these container names resolve from inside the cluster.
config:
  KAFKA_BROKERS: redpanda:9092
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  LLM_MODEL: claude-haiku-5-5

# Dev-only secrets. For a real deployment, create the Secret outside Git.
secrets:
  JWT_SECRET: change-me-in-real-life
  NEO4J_PASSWORD: devpassword
  ANTHROPIC_API_KEY: ""   # keep empty: the mock model is free

services:
  gateway:
    command: ["node_modules/.bin/tsx", "apps/gateway/src/index.ts"]
    port: 3000
    nodePort: 30000
    healthPath: /health
    replicas: 1
  orchestrator:
    command: ["node_modules/.bin/tsx", "apps/orchestrator/src/index.ts"]
    port: 9101
    nodePort: 30101
    replicas: 1
  agent-retrieval:
    command: ["node_modules/.bin/tsx", "apps/agents/src/index.ts"]
    env: { AGENT_NAME: retrieval }
    port: 9111
    nodePort: 30111
    replicas: 1
  agent-research:
    command: ["node_modules/.bin/tsx", "apps/agents/src/index.ts"]
    env: { AGENT_NAME: research }
    port: 9112
    nodePort: 30112
    replicas: 1
  agent-codegen:
    command: ["node_modules/.bin/tsx", "apps/agents/src/index.ts"]
    env: { AGENT_NAME: codegen }
    port: 9113
    nodePort: 30113
    replicas: 1

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
