# Source: agent-os/templates/services.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-codegen
  labels:
    app: agent-codegen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-codegen
  template:
    metadata:
      labels:
        app: agent-codegen
    spec:
      # Kubernetes would otherwise inject env vars like GATEWAY_PORT=tcp://10.96.x.x:3000
      # for every Service, which clashes with our own GATEWAY_PORT setting.
      enableServiceLinks: false
      containers:
        - name: agent-codegen
          image: "agent-os:dev"
          imagePullPolicy: IfNotPresent
          command: ["node_modules/.bin/tsx","apps/agents/src/index.ts"]
          envFrom:
            - configMapRef:
                name: agent-os-config
            - secretRef:
                name: agent-os-secrets
          env:
            - name: AGENT_NAME
              value: "codegen"
          ports:
            - containerPort: 9113
          readinessProbe:
            tcpSocket:
              port: 9113
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9113
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

